<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zest Bar and Restaurant - Menu</title>
<meta name="description" content="Zest Bar and Restaurant - Menu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{if(sessionStorage.getItem('zestIntroSeen'))document.documentElement.classList.add('seen')}catch(e){}</script>
<script>if('scrollRestoration' in history)history.scrollRestoration='manual';if(location.hash)history.replaceState(null,'',location.pathname+location.search);</script>
</head>
<body>
<header id="hero">
<div id="intro"><video id="v" autoplay muted playsinline webkit-playsinline preload="auto" poster="img/poster.jpg" src="video/zest-intro.mp4"></video><button id="play" type="button" aria-label="Play intro">&#9654;</button></div>
<span class="blob b1"></span><span class="blob b2"></span>
<img id="logo" src="img/logo.jpeg" alt="Zest Bar and Restaurant - tap to replay intro" title="Replay intro">
<p class="hours">Open daily 10:30 - midnight &middot; Livingstone 0978 109 392 / 0777 753 033</p>
<a class="go" href="#menu">View the menu</a>
</header>
<nav id="tabs" aria-label="Menu sections"></nav>
<main id="menu"></main>
<script src="menu.js"></script>
<script>
scrollTo(0,0);
const hero=document.getElementById('hero'),v=document.getElementById('v'),playBtn=document.getElementById('play');
const root=document.documentElement,seen=root.classList.contains('seen');
const done=()=>{hero.classList.add('done');playBtn.classList.remove('show');try{sessionStorage.setItem('zestIntroSeen','1')}catch(e){}};
v.muted=true;v.defaultMuted=true;
const start=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{})};
v.addEventListener('playing',()=>playBtn.classList.remove('show'));
v.addEventListener('ended',done);v.addEventListener('error',done);
v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime>v.duration-0.3)done()});
if(seen){v.removeAttribute('autoplay');v.pause();hero.classList.add('done')}else{v.addEventListener('canplay',start);start()}
['pointerdown','touchstart','keydown'].forEach(e=>addEventListener(e,()=>{if(v.paused&&!hero.classList.contains('done')&&v.currentTime===0)start()},{passive:true}));
setTimeout(()=>{if(v.paused&&!hero.classList.contains('done'))playBtn.classList.add('show')},1200);
playBtn.onclick=start;
document.getElementById('logo').onclick=()=>{root.classList.remove('seen');hero.classList.remove('done');v.currentTime=0;start()};
document.querySelector('.go').addEventListener('click',e=>{e.preventDefault();document.getElementById('tabs').scrollIntoView({behavior:'smooth'})});
const links=[...document.querySelectorAll('#tabs a')],secs=[...document.querySelectorAll('.sec')];
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+x.target.id));const a=document.querySelector('#tabs a.on');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}}),{rootMargin:'-30% 0px -65% 0px'});
secs.forEach(s=>io.observe(s));
</script>
</body>
</html>
